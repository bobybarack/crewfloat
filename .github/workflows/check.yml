name: Verify CrewFloat
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - run: npm run check:cloudflare
      - run: npx wrangler deploy -c cloudflare/wrangler.jsonc --dry-run --minify --outdir build
